<body>
<!--bitw-loader--><style>
.bitw-loader{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:rgba(10,8,7,.8);opacity:0;animation:bitwLoaderIn .25s ease .35s forwards}
.bitw-loader.is-done{animation:none;opacity:0;transition:opacity .2s;pointer-events:none}
.bitw-loader__box{display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px 30px 18px;background:#120D0C;border:1px solid #3B2620;border-radius:0}
.bitw-loader__t{margin:0;font:600 12.5px/1.2 'Archivo','Paperlogy',-apple-system,sans-serif;letter-spacing:-.01em;color:#AFA298;font-stretch:90%}
.bitw-hg{width:30px;height:45px;overflow:visible;animation:bitwFlip 2.4s cubic-bezier(.65,0,.35,1) infinite}
.bitw-hg .top,.bitw-hg .bot{transform-box:fill-box;transform-origin:50% 100%}
.bitw-hg .top{animation:bitwTop 2.4s linear infinite}
.bitw-hg .bot{animation:bitwBot 2.4s linear infinite}
.bitw-hg .flow{stroke-dasharray:2 2;animation:bitwFlow .3s linear infinite,bitwFlowOn 2.4s steps(1) infinite}
@keyframes bitwLoaderIn{to{opacity:1}}
@keyframes bitwFlip{0%,80%{transform:rotate(0)}100%{transform:rotate(180deg)}}
@keyframes bitwTop{0%{transform:scaleY(1)}78%,100%{transform:scaleY(0)}}
@keyframes bitwBot{0%{transform:scaleY(0)}78%,100%{transform:scaleY(1)}}
@keyframes bitwFlow{to{stroke-dashoffset:-4}}
@keyframes bitwFlowOn{0%{opacity:1}78%{opacity:0}}
@media (prefers-reduced-motion:reduce){.bitw-hg,.bitw-hg .top,.bitw-hg .bot,.bitw-hg .flow{animation:none}.bitw-hg .bot{transform:scaleY(.5)}.bitw-hg .top{transform:scaleY(.5)}}
</style><div class="bitw-loader" id="bitw-loader" role="status" aria-live="polite">
  <div class="bitw-loader__box">
    <svg class="bitw-hg" viewBox="0 0 24 36" aria-hidden="true">
      <defs><filter id="bitw-hgb" x="-30%" y="-10%" width="160%" height="120%"><feGaussianBlur stdDeviation=".35 .04"/></filter></defs>
      <g filter="url(#bitw-hgb)">
        <path class="top" d="M6.4 5H17.6C17 10.6 12.7 13.6 12 16.8C11.3 13.6 7 10.6 6.4 5Z" fill="#E8101B"/>
        <path class="bot" d="M6 33H18C17.4 28.2 13.6 25.6 12 24.2C10.4 25.6 6.6 28.2 6 33Z" fill="#E8101B"/>
        <line class="flow" x1="12" y1="17.6" x2="12" y2="32.5" stroke="#E8101B" stroke-width="1"/>
        <path d="M3 2H21M3 34H21M5 2C5 11 11.2 14.6 11.2 18C11.2 21.4 5 25 5 34M19 2C19 11 12.8 14.6 12.8 18C12.8 21.4 19 25 19 34" fill="none" stroke="#C1372B" stroke-width="1.6" stroke-linecap="square"/>
      </g>
    </svg>
    <p class="bitw-loader__t">PLAY 여는 중</p>
  </div>
</div><!--/bitw-loader-->

  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><filter id="hb" x="-20%" y="-60%" width="140%" height="220%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="1.2 .12"/></filter><linearGradient id="bitw-fade" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#E8101B"/><stop offset=".55" stop-color="#C1372B"/><stop offset="1" stop-color="#0A0807"/></linearGradient></svg>
